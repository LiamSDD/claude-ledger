[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-ledger"
version = "0.1.0"
description = "See where your Claude Code tokens and dollars go. A zero-dependency CLI that reads your local Claude Code transcripts and breaks spend down by model, project, day, session and subagent."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "LiamSDD" }]
keywords = ["claude", "claude-code", "anthropic", "tokens", "cost", "usage", "cli", "llm"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development",
  "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
claude-ledger = "claude_ledger.cli:main"

[project.urls]
Homepage = "https://github.com/LiamSDD/claude-ledger"
Repository = "https://github.com/LiamSDD/claude-ledger"
Changelog = "https://github.com/LiamSDD/claude-ledger/blob/main/CHANGELOG.md"
Issues = "https://github.com/LiamSDD/claude-ledger/issues"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["claude_ledger"]

[tool.setuptools.package-data]
claude_ledger = ["prices.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
