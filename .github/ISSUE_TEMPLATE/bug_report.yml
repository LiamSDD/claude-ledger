name: Bug report
description: Something in claude-ledger is wrong, crashes or prints the wrong numbers.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Security problems must not be reported here: use the Security tab to report them privately (see SECURITY.md).
        Never paste real transcripts. They can contain your prompts, code and file paths. A small synthetic transcript that reproduces the problem is ideal.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, and what you expected to see instead.
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and output
      description: The exact command you ran and its output. Remove anything private.
      render: text
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: If possible, include a minimal synthetic JSONL transcript that triggers the problem.
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: claude-ledger version
      description: Output of `claude-ledger --version`.
      placeholder: claude-ledger 0.1.0
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.12.4"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Windows
        - Other
    validations:
      required: true
  - type: input
    id: claude-code
    attributes:
      label: Claude Code version
      description: The version that wrote the transcripts, if known (the `version` field in transcript lines).
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: I have not included real transcripts or other private data.
          required: true
