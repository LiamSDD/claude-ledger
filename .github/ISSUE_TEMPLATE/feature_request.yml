name: Feature request
description: Suggest a new report, option or output format.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        claude-ledger stays zero-dependency, read-only and offline. Requests that need network access, runtime dependencies or writing to the projects directory will not be accepted.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What question about your usage or spend can you not answer today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: The command, option or output you have in mind. An example of the output helps.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other ways to get the answer, for example the existing `--json` output with `jq`.
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and discussions and this has not been requested.
          required: true
        - label: I am willing to open a pull request for this.
          required: false
